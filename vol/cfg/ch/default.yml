---
pid_dir: '~/.pg_chameleon/pid/'
log_dir: '~/.pg_chameleon/logs/'
log_dest: stdout
log_level: info
log_days_keep: 10
rollbar_key: ''
rollbar_env: ''

pg_conn:
  host: pg
  port: "5432"
  user: wbh
  password: wbh
  database: wbh
  charset: utf8

sources:
  unfixed: &source
    type: mysql
    db_conn:
      host: my
      port: "3306"
      user: wbh
      password: wbh
      charset: utf8
      connect_timeout: 10
    schema_mappings:
      wbh: unfixed
    limit_tables:
    skip_tables:
    grant_select_to: []
    lock_timeout: "120s"
    my_server_id: 100
    replica_batch_size: 10000
    replay_max_rows: 10000
    batch_retention: '1 day'
    copy_max_memory: "300M"
    copy_mode: file
    out_dir: /tmp
    sleep_loop: 1
    on_error_replay: continue
    on_error_read: continue
    auto_maintenance: disabled
    gtid_enable: false
    keep_existing_schema: Yes
    net_read_timeout: 600

  fixed:
    <<: *source
    schema_mappings:
      wbh: fixed
    my_server_id: 101
